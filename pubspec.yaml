name: gemini_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  animate_do: ^5.1.0
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_chat_types: ^3.6.2
  flutter_chat_ui: ^1.6.15
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  google_fonts: ^8.2.0
  image_picker: ^1.2.2
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets: 
    - .env
    - assets/avatar/velora-avatar-01.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_app/logo_app.png"
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#000000"
  image: "assets/logo_app/logo_app.png"
  branding: "assets/branding/branding-01.png"
  
  android_12:
    color: "#000000"
    image: "assets/logo_app/logo_app.png"
    icon_background_color: "#000000"
    branding: "assets/branding/branding-01.png"

  android_gravity: center
  ios_content_mode: center
  fullscreen: true

