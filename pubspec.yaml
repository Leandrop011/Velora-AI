name: gemini_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_chat_ui: ^2.11.1
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
